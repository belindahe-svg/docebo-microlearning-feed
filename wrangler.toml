name = "docebo-microlearning-feed"
main = "src/index.ts"
compatibility_date = "2025-02-24"

# Static frontend. The Worker runs first so it can add frame-ancestors headers to every response.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "microlearning-feed"
database_id = "REPLACE_WITH_D1_DATABASE_ID"   # from: npx wrangler d1 create microlearning-feed

[vars]
# "mock" serves the 10 real items captured from atalentdemo2 (no Docebo calls).
# "live" calls the Docebo API with the learner's own token.
DOCEBO_MODE = "mock"
DOCEBO_DOMAIN = "atalentdemo2.docebosaas.com"
DOCEBO_CHANNEL_ID = ""                 # numeric ID of the "Bite-size Learning" channel
DOCEBO_OAUTH_CLIENT_ID = ""            # OAuth2 app selected in the iFrame widget's Advanced Settings
DOCEBO_OAUTH_REDIRECT_URI = ""         # must match the OAuth2 app config, if Docebo requires it
# Endpoint templates (unconfirmed in public docs). Confirm with `npm run discover`, then set here.
DOCEBO_CHANNEL_ITEMS_PATH = "/learn/v1/channels/{channelId}/items"
DOCEBO_ASSET_VIEW_PATH = ""            # leave empty until a view-tracking endpoint is confirmed
# Comma-separated origins allowed to frame the app.
ALLOWED_FRAME_ANCESTORS = "https://atalentdemo2.docebosaas.com"
SESSION_TTL_SECONDS = "3600"

# Secrets (set with `npx wrangler secret put NAME`, never commit):
#   DOCEBO_SALT_SECRET          salt from the iFrame widget's Advanced Settings
#   DOCEBO_OAUTH_CLIENT_SECRET  secret of the OAuth2 app
#   ADMIN_TOKEN                 protects /api/admin/* (media URL overrides)
