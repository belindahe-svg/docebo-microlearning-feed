<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bite-size Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="stage">
    <header class="topbar" id="topbar" hidden>
      <div class="toprow">
        <div class="filters" id="filters" role="toolbar" aria-label="Filter the feed"></div>
        <button type="button" class="searchbtn" id="searchBtn" aria-label="Search the feed" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </div>
      <form class="searchrow" id="searchRow" role="search" hidden>
        <input id="q" type="search" placeholder="Search titles and channels" aria-label="Search the feed" autocomplete="off" enterkeyhint="search">
        <button type="button" id="searchClose">Cancel</button>
      </form>
    </header>
    <div class="feed" id="feed" tabindex="0" aria-label="Learning feed. Use the arrow keys to move between items."></div>

    <div class="status" id="status" role="status">Loading your feed</div>

    <section class="sheet" id="sheet" aria-label="Comments" aria-hidden="true">
      <header>
        <b id="sheetTitle">Comments</b><span class="src" id="sheetSrc"></span>
        <button type="button" id="closeSheet" aria-label="Close comments">×</button>
      </header>
      <ul class="clist" id="clist"></ul>
      <form class="cform" id="cform">
        <input id="cinput" maxlength="1000" placeholder="Add a comment" autocomplete="off" aria-label="Comment">
        <button type="submit">Post</button>
      </form>
    </section>

    <section class="sheet small" id="rateSheet" aria-label="Rate" aria-hidden="true">
      <header>
        <b id="rateTitle">Rate this</b>
        <button type="button" class="closeX" data-close="rateSheet" aria-label="Close rating">×</button>
      </header>
      <div class="stars" id="stars" role="radiogroup" aria-label="Your rating"></div>
      <p class="hint">Your rating is saved in Docebo.</p>
    </section>

    <section class="sheet" id="shareSheet" aria-label="Share" aria-hidden="true">
      <header>
        <b>Share</b>
        <button type="button" class="closeX" data-close="shareSheet" aria-label="Close share">×</button>
      </header>
      <div class="sharebody">
        <button type="button" class="copylink" id="copyLink">Copy link</button>
        <input class="linkbox" id="linkBox" readonly aria-label="Link to this item" hidden>
        <div id="inviteBox" hidden>
          <p class="hint">Invite colleagues to watch. Docebo sends them the invitation.</p>
          <input id="inviteSearch" type="search" placeholder="Search people (3+ letters)" autocomplete="off" aria-label="Search people">
          <ul class="ulist" id="ulist"></ul>
          <button type="button" class="sendinv" id="sendInvite" disabled>Send invite</button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" role="alert" hidden></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
